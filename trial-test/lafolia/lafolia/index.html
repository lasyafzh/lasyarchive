<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lafolia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="entry" id="entry">
  <p>Welcome to</p>
  <h1 class="script">Lafolia</h1>
  <p>a little bookshelf on the internet</p>
  <button class="start" id="start">Click start</button>
</main>
<div class="mini" aria-hidden="true" id="mini"></div>
<script>
  // rak mini dekoratif di bagian bawah
  const hs=[90,130,70,110,150,85,120,100,140,75,115];
  document.getElementById('mini').innerHTML=hs.map((h,i)=>`<i style="height:${h}px;animation-delay:${i*70}ms"></i>`).join('');
  document.getElementById('start').addEventListener('click',()=>{
    document.getElementById('entry').classList.add('leave');
    setTimeout(()=>location.href='collection.html',550);
  });
</script>
</body>
</html>
